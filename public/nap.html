<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nạp tiền · DuydevTool</title>
<link rel="stylesheet" href="/aurora.css">
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <a class="logo" href="/">DuydevTool</a>
    <div class="nav-links">
      <a href="/">Trang chủ</a>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/tool-tx.html">Tài Xỉu</a>
      <a href="/tool-bcr.html">Baccarat</a>
    </div>
    <div style="display:flex;gap:8px;align-items:center" id="userChip"></div>
  </div>
</header>

<div class="wrap" style="padding-top:24px">

  <div class="card">
    <h2 style="font-size:18px;font-weight:900;margin-bottom:14px">💰 NẠP TIỀN</h2>

    <label class="lbl">Chọn số tiền</label>
    <div class="grid c4" style="margin-bottom:14px">
      <button class="btn" onclick="pickAmount(20000)">20K</button>
      <button class="btn" onclick="pickAmount(50000)">50K</button>
      <button class="btn" onclick="pickAmount(100000)">100K</button>
      <button class="btn" onclick="pickAmount(200000)">200K</button>
      <button class="btn" onclick="pickAmount(500000)">500K</button>
      <button class="btn" onclick="pickAmount(1000000)">1 Triệu</button>
    </div>

    <div class="field">
      <label class="lbl">Hoặc nhập số tiền (tối thiểu 10.000đ)</label>
      <input class="inp" type="number" id="amountInput" placeholder="100000" min="10000">
    </div>

    <button class="btn btn-primary btn-lg" onclick="createNap()">Tạo lệnh nạp</button>
  </div>

  <div class="card mt-24" id="qrBox" style="display:none">
    <h3 style="font-size:16px;font-weight:900;margin-bottom:14px">📸 QUÉT QR ĐỂ NẠP</h3>
    <div class="center mb-16">
      <img id="qrImg" src="" style="border-radius:14px;max-width:280px;margin:0 auto;background:#fff;padding:8px">
    </div>
    <div class="pred-detail">
      <div style="margin-bottom:6px"><b>Số tiền:</b> <span id="qrAmount"></span></div>
      <div style="margin-bottom:6px"><b>Ngân hàng:</b> <span id="qrBank"></span></div>
      <div style="margin-bottom:6px"><b>Số TK:</b> <span id="qrAcc"></span></div>
      <div style="margin-bottom:6px"><b>Chủ TK:</b> <span id="qrOwner"></span></div>
      <div><b>Nội dung:</b> <span id="qrCode" style="color:var(--vip);font-weight:900"></span></div>
    </div>

    <div style="margin-top:16px">
      <label class="lbl">Sau khi chuyển khoản, gửi ảnh bill</label>
      <input type="file" class="inp" id="billFile" accept="image/*">
      <button class="btn btn-ok btn-lg" style="margin-top:10px" onclick="uploadBill()">Gửi bill</button>
    </div>
  </div>

  <div class="card mt-24" style="border-color:rgba(244,166,8,.3);background:rgba(244,166,8,.06)">
    <p style="color:var(--warn);font-size:13px;line-height:1.7">
      ⚠️ <b>Lưu ý:</b> Nhập ĐÚNG số tiền và nội dung. Sau khi chuyển khoản, gửi ảnh bill để admin duyệt.
      Thời gian duyệt: 1-30 phút trong giờ hành chính.
    </p>
  </div>

</div>

<script src="/app.js"></script>
<script>
let currentNap = null;

function pickAmount(a) {
  $('#amountInput').value = a;
}

async function createNap() {
  const amount = parseInt($('#amountInput').value);
  if (!amount || amount < 10000) {
    toast('Số tiền tối thiểu 10.000đ', 'err');
    return;
  }

  const r = await api('/api/nap/create', {
    method: 'POST',
    body: JSON.stringify({ amount })
  });

  if (!r.ok) {
    toast(r.msg || 'Lỗi', 'err');
    return;
  }

  currentNap = r;

  $('#qrBox').style.display = 'block';
  $('#qrImg').src = r.qr;
  $('#qrAmount').textContent = fmtPrice(amount);
  $('#qrBank').textContent = r.bank.bank;
  $('#qrAcc').textContent = r.bank.account;
  $('#qrOwner').textContent = r.bank.owner;
  $('#qrCode').textContent = r.code;

  toast('Đã tạo lệnh nạp, vui lòng quét QR', 'ok');
  window.scrollTo({ top: $('#qrBox').offsetTop, behavior: 'smooth' });
}

async function uploadBill() {
  if (!currentNap) {
    toast('Chưa tạo lệnh nạp', 'err');
    return;
  }
  const file = $('#billFile').files[0];
  if (!file) {
    toast('Chưa chọn ảnh', 'err');
    return;
  }

  const fd = new FormData();
  fd.append('image', file);
  fd.append('code', currentNap.code);
  fd.append('amount', currentNap.amount);

  try {
    const r = await fetch('/api/nap/bill', { method: 'POST', body: fd, credentials: 'same-origin' });
    const j = await r.json();
    if (j.ok) {
      toast('Đã gửi bill, chờ admin duyệt', 'ok');
      setTimeout(() => location.href = '/dashboard.html', 1200);
    } else {
      toast(j.msg || 'Lỗi gửi bill', 'err');
    }
  } catch (e) {
    toast('Lỗi kết nối', 'err');
  }
}

renderUserChip();
</script>
</body>
</html>
