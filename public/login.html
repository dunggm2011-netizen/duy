<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập · DuydevTool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;900&family=Outfit:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="/aurora.css">
</head>
<body class="dark">

<div class="auth-wrap">
  <div class="auth-box">
    <div style="font-family:var(--font-display);font-size:26px;font-weight:900;letter-spacing:4px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:6px">DUYDEVTOOL</div>
    <p class="sub">Đăng nhập để sử dụng hệ thống</p>

    <div class="alert err" id="err"></div>

    <form id="loginForm">
      <div class="field">
        <label class="lbl">Tên đăng nhập</label>
        <input class="inp" name="username" placeholder="Nhập username" required autocomplete="username">
      </div>
      <div class="field">
        <label class="lbl">Mật khẩu</label>
        <input class="inp" type="password" name="password" placeholder="Nhập mật khẩu" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-lg" type="submit">→ ĐĂNG NHẬP</button>
    </form>

    <p class="muted center mt-16">
      Chưa có tài khoản? <a href="/register.html"><b>Đăng ký ngay</b></a>
    </p>
    <p class="muted center mt-8">
      <a href="/">← Về trang chủ</a>
    </p>
  </div>
</div>

<script src="/app.js"></script>
<script>
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'Đang đăng nhập...';

  const r = await api('/api/login', {
    method: 'POST',
    body: JSON.stringify({
      username: fd.get('username').trim(),
      password: fd.get('password')
    })
  });

  if (r.ok) {
    toast('Đăng nhập thành công', 'ok');
    setTimeout(() => location.href = r.role === 'admin' ? '/admin.html' : '/dashboard.html', 500);
  } else {
    const err = $('#err');
    err.textContent = r.msg || 'Lỗi đăng nhập';
    err.classList.add('on');
    btn.disabled = false;
    btn.textContent = '→ ĐĂNG NHẬP';
  }
});
</script>
</body>
</html>
