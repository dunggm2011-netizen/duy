<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng ký · DuydevTool</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="logo">DuydevTool</div>
    <p class="sub">Tạo tài khoản mới</p>

    <div class="alert err" id="err"></div>

    <form id="regForm">
      <div class="field">
        <label class="lbl">Tên đăng nhập</label>
        <input class="inp" name="username" placeholder="Tối thiểu 3 ký tự" required minlength="3" autocomplete="username">
      </div>
      <div class="field">
        <label class="lbl">Email (không bắt buộc)</label>
        <input class="inp" type="email" name="email" placeholder="email@example.com">
      </div>
      <div class="field">
        <label class="lbl">Mật khẩu</label>
        <input class="inp" type="password" name="password" placeholder="Tối thiểu 6 ký tự" required minlength="6" autocomplete="new-password">
      </div>
      <button class="btn btn-ok btn-lg" type="submit">+ ĐĂNG KÝ</button>
    </form>

    <p class="muted center" style="margin-top:16px">
      Đã có tài khoản? <a href="/login.html"><b>Đăng nhập</b></a>
    </p>
  </div>
</div>

<script src="/app.js"></script>
<script>
$('#regForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'Đang đăng ký...';

  const r = await api('/api/register', {
    method: 'POST',
    body: JSON.stringify({
      username: fd.get('username').trim(),
      password: fd.get('password'),
      email: fd.get('email').trim() || null
    })
  });

  if (r.ok) {
    toast('Đăng ký thành công', 'ok');
    setTimeout(() => location.href = '/login.html', 800);
  } else {
    const err = $('#err');
    err.textContent = r.msg || 'Lỗi đăng ký';
    err.classList.add('on');
    btn.disabled = false;
    btn.textContent = '+ ĐĂNG KÝ';
  }
});
</script>
</body>
</html>
