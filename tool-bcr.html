<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tool Baccarat · DuydevTool</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <a class="logo" href="/">DuydevTool</a>
    <div class="nav-links">
      <a href="/">Trang chủ</a>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/tool-tx.html">Tài Xỉu</a>
      <a href="/tool-bcr.html" class="on">Baccarat</a>
    </div>
    <div style="display:flex;gap:8px;align-items:center" id="userChip"></div>
  </div>
</header>

<div class="wrap" style="padding-top:24px">

  <div class="card mb-16">
    <div class="stats" style="margin:0">
      <div class="stat"><div class="l">Tổng bàn</div><div class="n" id="sBan">—</div></div>
      <div class="stat"><div class="l">Dự đoán được</div><div class="n" id="sPred">—</div></div>
      <div class="stat"><div class="l">Độ tin cậy TB</div><div class="n" id="sConf">—</div></div>
      <div class="stat"><div class="l">Cập nhật</div><div class="n" id="sTime" style="font-size:12px">—</div></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="fetchBcr(true)">🚀 Lấy dữ liệu</button>
      <button class="btn" id="autoBtn" onclick="toggleAuto()">▶ Auto 10s</button>
      <div class="field" style="margin:0;flex:1;min-width:180px">
        <input class="inp" id="searchInput" placeholder="🔍 Tìm bàn... (số bàn hoặc pattern)" oninput="renderList()">
      </div>
    </div>
  </div>

  <div class="sec-title"><h2>DANH SÁCH BÀN</h2><i></i></div>

  <div class="pred-list" id="bcrList">
    <div class="card center"><div class="spinner"></div></div>
  </div>

</div>

<script src="/app.js"></script>
<script>
let autoTimer = null;
let dataCache = [];

async function fetchBcr(showToast) {
  const r = await api('/api/bcr');
  if (r.error) {
    if (showToast) toast('Lỗi: ' + r.error, 'err');
    return;
  }

  dataCache = r.predictions || [];

  $('#sBan').textContent = r.tong_ban || 0;
  $('#sPred').textContent = r.ban_du_doan_duoc || 0;
  $('#sConf').textContent = r.do_tin_cay_trung_binh || '—';
  $('#sTime').textContent = r.time ? new Date(r.time).toLocaleTimeString('vi-VN') : '—';

  renderList();
  if (showToast) toast('Đã cập nhật ' + dataCache.length + ' bàn', 'ok');
}

function renderList() {
  const q = ($('#searchInput').value || '').toLowerCase().trim();
  const list = $('#bcrList');

  const filtered = dataCache.filter(x => {
    if (!q) return true;
    const t = String(x.table || '').toLowerCase();
    const p = String(x.pattern || '').toLowerCase();
    const d = String(x.dudoan || '').toLowerCase();
    return t.includes(q) || p.includes(q) || d.includes(q);
  });

  if (!filtered.length) {
    list.innerHTML = '<div class="card center muted">Không có bàn phù hợp</div>';
    return;
  }

  list.innerHTML = filtered.map(x => {
    const isP = x.dudoan === 'PLAYER';
    const cls = isP ? 'p' : 'b';
    const label = isP ? 'PLAYER' : 'BANKER';

    const hist = (x.result || '').split('').map(c => {
      const k = c === 'P' ? 'p' : (c === 'B' ? 'b' : 'x');
      const txt = c === 'P' ? 'P' : (c === 'B' ? 'B' : 'T');
      return `<span class="${k}">${txt}</span>`;
    }).join('');

    return `
      <div class="pred-item">
        <div>
          <div class="table-no">BÀN ${x.table} · PHIÊN ${x.phien}</div>
          <div class="result ${cls}">${label}</div>
          <div class="pattern">${x.pattern || '—'}</div>
          <div class="pred-history">${hist}</div>
          <div class="muted" style="font-size:11.5px;margin-top:6px">${x.giaithich || ''}</div>
        </div>
        <div>
          <div class="confidence">${x.dotincay || '—'}<small>CONFIDENCE</small></div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleAuto() {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    $('#autoBtn').textContent = '▶ Auto 10s';
    $('#autoBtn').classList.remove('btn-primary');
  } else {
    fetchBcr();
    autoTimer = setInterval(fetchBcr, 10000);
    $('#autoBtn').textContent = '⏸ Đang chạy';
    $('#autoBtn').classList.add('btn-primary');
  }
}

renderUserChip();
fetchBcr();
</script>
</body>
</html>
